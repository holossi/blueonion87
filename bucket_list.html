<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>버킷리스트 가계부</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#DDD8CE;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#2C2C2A}
.top-label{font-size:10px;font-weight:500;color:#B4B2A9;letter-spacing:.06em;margin-bottom:3px}
.top-title{font-size:17px;font-weight:500;color:#2C2C2A;margin-bottom:3px}
.top-desc{font-size:11px;color:#B4B2A9;margin-bottom:1.5rem;font-style:italic}
.summary-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:1rem}
.sum-card{background:#EDE8DE;border-radius:10px;padding:10px 12px;text-align:center}
.sum-label{font-size:10px;font-weight:500;color:#B4B2A9;margin-bottom:4px}
.sum-val{font-size:15px;font-weight:500;color:#2C2C2A}
.total-prog{background:#FDFAF6;border:0.5px solid #D3D1C7;border-radius:12px;padding:13px 15px;margin-bottom:1rem}
.prog-label{display:flex;justify-content:space-between;font-size:11px;color:#888780;margin-bottom:6px}
.prog-track{height:8px;background:#EDE8DE;border-radius:4px;overflow:hidden;margin-bottom:4px}
.prog-bar{height:100%;border-radius:4px;background:#639922;transition:width .4s}
.calc-card{background:#2C2C2A;border-radius:12px;padding:14px 15px;margin-bottom:1.5rem}
.calc-title{font-size:11px;font-weight:500;color:#888780;margin-bottom:10px}
.calc-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.calc-input{flex:1;height:36px;border:0.5px solid rgba(255,255,255,.15);border-radius:8px;padding:0 12px;font-size:13px;background:rgba(255,255,255,.08);color:#F5F0E8}
.calc-input::placeholder{color:#888780}
.calc-input:focus{outline:none;border-color:rgba(255,255,255,.3)}
.calc-result{background:rgba(255,255,255,.07);border-radius:10px;padding:10px 13px}
.calc-result-label{font-size:10px;color:#888780;margin-bottom:4px}
.calc-result-val{font-size:20px;font-weight:500;color:#EF9F27}
.calc-result-sub{font-size:11px;color:#888780;margin-top:3px}
.sec-label{font-size:10px;font-weight:500;color:#B4B2A9;letter-spacing:.04em;margin-bottom:10px}
.bucket-card{background:#FDFAF6;border:0.5px solid #D3D1C7;border-radius:12px;padding:14px 15px;margin-bottom:10px}
.bucket-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
.b-left{display:flex;align-items:flex-start;gap:10px;flex:1}
.b-emoji{font-size:20px;flex-shrink:0;margin-top:1px}
.b-info{flex:1}
.b-title{font-size:13px;font-weight:500;color:#2C2C2A;margin-bottom:3px;line-height:1.3}
.b-when{font-size:10px;font-weight:500;padding:1px 7px;border-radius:8px;display:inline-block;margin-bottom:3px}
.b-sub{font-size:10px;color:#B4B2A9;line-height:1.4;margin-top:2px}
.b-cost{text-align:right;flex-shrink:0;margin-left:8px}
.cost-label{font-size:9px;font-weight:500;color:#B4B2A9;margin-bottom:2px}
.cost-val{font-size:15px;font-weight:500;color:#2C2C2A}
.b-prog-row{display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px}
.b-prog-track{height:5px;background:#EDE8DE;border-radius:3px;overflow:hidden;margin-bottom:8px}
.b-input-row{display:flex;align-items:center;gap:7px}
.b-input{flex:1;height:32px;border:0.5px solid #D3D1C7;border-radius:8px;padding:0 10px;font-size:12px;background:#F5F0E8;color:#2C2C2A}
.b-input:focus{outline:none;border-color:#888780}
.add-btn{height:32px;padding:0 12px;border:0.5px solid #D3D1C7;border-radius:8px;background:#F5F0E8;color:#888780;font-size:12px;cursor:pointer}
.add-btn:hover{border-color:#888780;color:#2C2C2A}
.memo-inp{width:100%;height:28px;border:0.5px solid #D3D1C7;border-radius:8px;padding:0 10px;font-size:11px;background:#F5F0E8;color:#2C2C2A;margin-top:6px}
.memo-inp:focus{outline:none;border-color:#888780}
.dep-list{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.dep-item{display:flex;align-items:center;gap:6px;padding:5px 8px;background:#EDE8DE;border-radius:7px;font-size:11px}
.dep-del{cursor:pointer;color:#B4B2A9;margin-left:auto}
.dep-del:hover{color:#9B3020}

/* ── 공통 헤더 ── */
.site-header{position:sticky;top:0;z-index:100;background:#F5F0E8;border-bottom:0.5px solid #D3D1C7;padding:1.5rem 1.5rem 0}
.site-header-title{font-size:20px;font-weight:500;color:#2C2C2A;text-decoration:none;letter-spacing:-.02em;display:block;margin-bottom:6px}
.site-header-title:hover{color:#888780}
.site-header-manifesto{font-size:11px;color:#888780;font-style:italic;margin-bottom:3px}
.site-header-keywords{font-size:10px;color:#B4B2A9;letter-spacing:.04em}
.site-header-nav{display:flex;gap:6px;padding:10px 0 12px;overflow-x:auto;scrollbar-width:none}
.site-header-nav::-webkit-scrollbar{display:none}
.site-nav-btn{font-size:11px;padding:4px 11px;border:0.5px solid #D3D1C7;border-radius:14px;background:#FDFAF6;color:#5F5E5A;text-decoration:none;white-space:nowrap;flex-shrink:0}
.site-nav-btn:hover{border-color:#888780;color:#2C2C2A;background:#EDE8DE}


.page-wrap{max-width:700px;margin:0 auto;background:#F5F0E8;min-height:100vh;padding:0 1.5rem 1.5rem;position:relative}
</style>
</head>
<body>
<div class="page-wrap">
<!-- ── 공통 헤더 ── -->
<div class="site-header">
  <a class="site-header-title" href="index.html">나의 우주 🌙</a>
  <div class="site-header-manifesto">"기꺼이 머뭇거리고, 용기 있게 취약한"</div>
  <div class="site-header-keywords">취약성 · 머뭇거림 · 삶다움</div>
  <div class="site-header-nav">
    <a class="site-nav-btn" href="master_planner_2026.html#week">탑다운 플래너</a>
    <a class="site-nav-btn" href="life_roadmap_beige.html">인생 로드맵</a>
    <a class="site-nav-btn" href="bucket_list.html">버킷 가계부</a>
  </div>
</div>
<div class="top-label">혼자 살게 되면 · 버킷리스트 가계부</div>
<div class="top-title">하고 싶은 것들 💛</div>
<div class="top-desc">수입의 10%씩 · 타임라인 순으로</div>

<div class="summary-row">
  <div class="sum-card"><div class="sum-label">총 목표</div><div class="sum-val" id="tg">-</div></div>
  <div class="sum-card"><div class="sum-label">현재 적립</div><div class="sum-val" id="ts" style="color:#639922">-</div></div>
  <div class="sum-card"><div class="sum-label">남은 금액</div><div class="sum-val" id="tr" style="color:#9B3020">-</div></div>
</div>

<div class="total-prog">
  <div class="prog-label"><span>전체 달성률</span><span id="tp">0%</span></div>
  <div class="prog-track"><div class="prog-bar" id="tb" style="width:0%"></div></div>
  <div style="font-size:10px;color:#B4B2A9;text-align:right" id="td">적립을 시작해봐요</div>
</div>

<div class="calc-card">
  <div class="calc-title">💰 10% 적립 계산기 — 수입이 들어오면</div>
  <div class="calc-row">
    <input class="calc-input" id="income-inp" type="number" placeholder="이번 수입 입력 (원)" oninput="calcTen()">
  </div>
  <div class="calc-result">
    <div class="calc-result-label">버킷리스트 통장에 넣을 금액 (10%)</div>
    <div class="calc-result-val" id="ten-result">—</div>
    <div class="calc-result-sub" id="ten-sub">수입을 입력하면 10%가 계산돼요</div>
  </div>
</div>
<div style="height:1.5rem"></div>

<div class="sec-label">버킷리스트 · 시기 순</div>
<div id="bucket-list"></div>

<script>
var ITEMS = [
  {id:'cat', emoji:'🐱', title:'고양이 입양 + 동네 고양이 대모',
   when:'2027년 봄', wc:'#3B6D11', wb:'#EAF3DE',
   goal:1500000, color:'#3B6D11', sub:'입양비+초기 용품+병원비 · 이후 월 유지비 별도'},
  {id:'surgery1', emoji:'✨', title:'가슴 줄기세포 지방이식 1차 (SC301)',
   when:'2027년 겨울', wc:'#D85A30', wb:'#FAECE7',
   goal:9000000, color:'#D85A30', sub:'1차 수술 · 겨울에 회복이 좋음'},
  {id:'car', emoji:'🚗', title:'중고차 구입 + 운전 연수',
   when:'2027년 겨울', wc:'#BA7517', wb:'#FAEEDA',
   goal:10000000, color:'#BA7517', sub:'차량 500~800만원 + 연수비 100~200만원 예상'},
  {id:'surgery2', emoji:'✨', title:'가슴 줄기세포 지방이식 2차 (SC301)',
   when:'2028년 봄', wc:'#D85A30', wb:'#FAECE7',
   goal:9000000, color:'#D85A30', sub:'2차 수술 · 총 1,800만원 완성'},
  {id:'japan', emoji:'🇯🇵', title:'일본 어학연수',
   when:'2028년 가을~겨울', wc:'#555553', wb:'#E8E8E6',
   goal:5000000, color:'#1A6E9A', sub:'교토·가나자와 or 홋카이도 · 책방 영업 종료 + 수술 회복 후'}
];

var deps = {};
ITEMS.forEach(function(i){ deps[i.id] = JSON.parse(localStorage.getItem('bl-'+i.id)||'[]'); });

function save(id){ localStorage.setItem('bl-'+id, JSON.stringify(deps[id])); }

function addDep(id){
  var inp=document.getElementById('i-'+id);
  var memo=document.getElementById('m-'+id);
  var amt=parseInt((inp.value||'').replace(/[^0-9]/g,''));
  if(!amt||amt<=0) return;
  var d=new Date();
  var date=(d.getMonth()+1)+'월 '+d.getDate()+'일';
  deps[id].push({amt:amt, memo:(memo&&memo.value.trim())||'적립', date:date});
  save(id); inp.value=''; if(memo) memo.value='';
  render();
}

function delDep(id,idx){ deps[id].splice(idx,1); save(id); render(); }

function fmt(n){
  if(n>=10000000) return (n/10000000).toFixed(1).replace(/\.0$/,'')+'천만원';
  if(n>=10000) return Math.round(n/10000)+'만원';
  return n.toLocaleString()+'원';
}

function calcTen(){
  var v=parseInt((document.getElementById('income-inp').value||'').replace(/[^0-9]/g,''));
  var res=document.getElementById('ten-result');
  var sub=document.getElementById('ten-sub');
  if(!v||v<=0){ res.textContent='—'; sub.textContent='수입을 입력하면 10%가 계산돼요'; return; }
  var ten=Math.round(v*0.1);
  res.textContent=fmt(ten);
  sub.textContent='수입 '+fmt(v)+' × 10% — 버킷리스트 통장에 이체하기';
}

function render(){
  var tg=0, ts=0;
  ITEMS.forEach(function(item){
    tg+=item.goal;
    ts+=deps[item.id].reduce(function(a,d){ return a+d.amt; },0);
  });
  var tr=Math.max(0,tg-ts);
  var tp=tg?Math.round(ts/tg*100):0;
  document.getElementById('tg').textContent=fmt(tg);
  document.getElementById('ts').textContent=fmt(ts);
  document.getElementById('tr').textContent=fmt(tr);
  document.getElementById('tp').textContent=tp+'%';
  document.getElementById('tb').style.width=Math.min(tp,100)+'%';
  document.getElementById('td').textContent=ts>0?fmt(ts)+' 적립 · '+fmt(tr)+' 남음':'적립을 시작해봐요';

  var list=document.getElementById('bucket-list');
  list.innerHTML='';
  ITEMS.forEach(function(item){
    var saved=deps[item.id].reduce(function(a,d){ return a+d.amt; },0);
    var pct=Math.min(100, item.goal?Math.round(saved/item.goal*100):0);
    var done=saved>=item.goal;

    var depHtml='';
    deps[item.id].forEach(function(d,i){
      depHtml+='<div class="dep-item"><span style="color:#888780;flex-shrink:0">'+d.date+'</span><span style="flex:1;margin:0 8px;color:#5F5E5A">'+d.memo+'</span><span style="font-weight:500;color:#2C2C2A">+'+fmt(d.amt)+'</span><span class="dep-del" onclick="delDep(\''+item.id+'\','+i+')">✕</span></div>';
    });

    var h='<div class="bucket-card">';
    h+='<div class="bucket-head"><div class="b-left"><div class="b-emoji">'+item.emoji+'</div><div class="b-info">';
    h+='<div class="b-title">'+item.title+'</div>';
    h+='<span class="b-when" style="background:'+item.wb+';color:'+item.wc+'">'+item.when+'</span>';
    if(item.sub) h+='<div class="b-sub">'+item.sub+'</div>';
    h+='</div></div>';
    h+='<div class="b-cost"><div class="cost-label">목표</div><div class="cost-val">'+fmt(item.goal)+'</div>';
    if(done) h+='<div style="font-size:10px;font-weight:500;color:#639922;margin-top:2px">완료 ✓</div>';
    h+='</div></div>';

    h+='<div class="b-prog-row"><span style="font-weight:500;color:'+item.color+'">'+pct+'%</span><span style="color:#888780">'+fmt(saved)+' / '+fmt(item.goal)+'</span></div>';
    h+='<div class="b-prog-track"><div style="height:100%;border-radius:3px;background:'+item.color+';width:'+pct+'%;transition:width .4s"></div></div>';
    h+='<div class="b-input-row"><input class="b-input" id="i-'+item.id+'" type="number" placeholder="적립 금액 (원)"><button class="add-btn" onclick="addDep(\''+item.id+'\')">+ 적립</button></div>';
    h+='<input class="memo-inp" id="m-'+item.id+'" type="text" placeholder="메모 (예: 5월 원고료에서)">';
    if(deps[item.id].length>0) h+='<div class="dep-list">'+depHtml+'</div>';
    h+='</div>';
    list.innerHTML+=h;
  });
}

render();
</script>
</div>
</body>
</html>
