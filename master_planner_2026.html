<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 마스터 플래너</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#DDD8CE;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#2C2C2A}
.lv{display:none}.lv.on{display:block}
.site-header{position:sticky;top:0;z-index:100;background:#F5F0E8;border-bottom:0.5px solid #D3D1C7;padding:1.5rem 1.5rem 0}
.site-header-title{font-size:20px;font-weight:500;color:#2C2C2A;text-decoration:none;letter-spacing:-.02em;display:block;margin-bottom:6px}
.site-header-title:hover{color:#888780}
.site-header-manifesto{font-size:11px;color:#888780;font-style:italic;margin-bottom:3px}
.site-header-keywords{font-size:10px;color:#B4B2A9;letter-spacing:.04em}
.site-header-nav{display:flex;gap:6px;padding:10px 0 12px;overflow-x:auto;scrollbar-width:none}
.site-header-nav::-webkit-scrollbar{display:none}
.site-nav-btn{font-size:11px;padding:4px 11px;border:0.5px solid #D3D1C7;border-radius:14px;background:#FDFAF6;color:#5F5E5A;text-decoration:none;white-space:nowrap;flex-shrink:0}
.site-nav-btn:hover{border-color:#888780;color:#2C2C2A;background:#EDE8DE}
.page-wrap{max-width:700px;margin:0 auto;background:#F5F0E8;min-height:100vh;padding:0 1.5rem 1.5rem;position:relative}
.bc{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-bottom:1rem;font-size:11px}
.bci{cursor:pointer;color:#888780}.bci:hover{color:#2C2C2A}.bci.on{color:#2C2C2A;font-weight:500;cursor:default}
.bcs{color:#D3D1C7}
.back-btn{font-size:11px;padding:5px 12px;border:0.5px solid #D3D1C7;border-radius:14px;background:#F5F0E8;color:#888780;cursor:pointer;margin-bottom:1rem;display:inline-flex;align-items:center;gap:4px}
.back-btn:hover{border-color:#888780;color:#2C2C2A}
.sec-label{font-size:10px;font-weight:500;color:#B4B2A9;letter-spacing:.04em;margin-bottom:8px;margin-top:1.25rem}
.sc-card{border-radius:12px;padding:16px;background:#2C2C2A;margin-bottom:1rem}
.sc-vision{font-size:13px;color:#F5F0E8;line-height:1.7;font-style:italic;margin-bottom:12px}
.sc-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sc-stat{background:rgba(255,255,255,.07);border-radius:8px;padding:8px 10px;text-align:center}
.sc-stat-label{font-size:9px;color:#888780;margin-bottom:3px}
.sc-stat-val{font-size:13px;font-weight:500;color:#F5F0E8}
.sc-stat-goal{font-size:9px;color:#639922;margin-top:3px}
.dw-grid{display:flex;flex-direction:column;gap:8px;margin-bottom:1rem}
.dw{border-radius:12px;padding:13px 15px;border:0.5px solid #D3D1C7;cursor:pointer;background:#FDFAF6}
.now-badge{font-size:9px;font-weight:500;padding:1px 6px;border-radius:8px;background:#FAEEDA;color:#854F0B;margin-left:5px}
.yr-list{display:flex;flex-direction:column;gap:8px;margin-bottom:1rem}
.yc{border:0.5px solid #D3D1C7;border-radius:12px;padding:13px 15px;background:#FDFAF6}
.yc-head{display:flex;align-items:center;justify-content:space-between}
.goal-item{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;border-radius:8px;cursor:pointer;margin-bottom:6px;border:0.5px solid rgba(0,0,0,0.05)}
.g-chk{width:15px;height:15px;border-radius:4px;border:1.5px solid rgba(0,0,0,.2);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;background:#fff}
.goal-item.done .g-chk {background:#639922;border-color:#639922}
.goal-item.done .g-chk::after {content:'';display:block;width:6px;height:4.5px;border-left:1.8px solid #fff;border-bottom:1.8px solid #fff;transform:rotate(-45deg) translateY(-1px)}
.g-text{font-size:12.5px;color:#2C2C2A;font-weight:500;line-height:1.4}
.goal-item.done .g-text {text-decoration:line-through;color:#B4B2A9}
.g-sub{font-size:10.5px;color:#888780;margin-top:2px}
</style>
</head>
<body>
<div class="page-wrap">
  <div class="site-header">
    <a class="site-header-title" href="index.html">나의 우주 🌙</a>
    <div class="site-header-manifesto">"기꺼이 머뭇거리고, 용기 있게 취약한"</div>
    <div class="site-header-keywords">취약성 · 머뭇거림 · 삶다움</div>
    <div class="site-header-nav">
      <a class="site-nav-btn" href="master_planner_2026.html">탑다운 플래너</a>
      <a class="site-nav-btn" href="life_roadmap_beige.html">인생 로드맵</a>
      <a class="site-nav-btn" href="bucket_list.html">버킷 가계부</a>
    </div>
  </div>
  <div style="height:1.5rem"></div>

  <div class="bc" id="bc"></div>
  <div id="lv-home" class="lv on"></div>
  <div id="lv-years" class="lv"></div>
  <div id="lv-year" class="lv"></div>

<script>
var curLv='home', curYear=2026;

var YG = {
  2026: {keyword:'끊고 시작하는 해', goals:[
    {id:'g26-1', t:'결혼생활 마무리 완료', sub:'조정이혼 · 가을 실행 · 겨울 법적 완료', bg:'#FAE8E5'},
    {id:'g26-2', t:'경장편 초고 완성 + 겨울 연재 시작', sub:'세노테 다이빙 매일 밤 · 가을 탈고', bg:'#EEEDFE'},
    {id:'g26-3', t:'〈삶을 위한 연구〉 연재 + 산문집 원고 마감', sub:'매주 금요일 발행 · 연말 출판사 투고', bg:'#EAF3DE'},
    {id:'g26-4', t:'재정 기반 정비', sub:'수입 2,000만원 · 전세 및 생활 독립 기반 구축', bg:'#FAEEDA'},
    {id:'g26-5', t:'브랜드 + 전 채널 정렬', sub:'인스타그램 및 스티비 뉴스레터 정비', bg:'#EDE8DE'}
  ]},
  2027: {keyword:'새로 짓는 해', goals:[
    {id:'g27-1', t:'독립 주거 안착 완료', sub:'새 공간 계약 및 가구 세팅', bg:'#FAE8E5'},
    {id:'g27-2', t:'장편 퇴고·마감 + ARKO 출간 계약', sub:'봄 초고 마무리 → 여름 최종 마감', bg:'#EEEDFE'},
    {id:'g27-3', t:'고양이 입양 🐱', sub:'버킷 가계부 연동 예산 집행', bg:'#EAF3DE'}
  ]},
  2028: {keyword:'이름값이 붙기 시작하는 해', goals:[
    {id:'g28-1', t:'소설집 출간 및 첫 유료 강의 운영', sub:'여름 출간 목표 · 독자 오프라인 모임', bg:'#EEEDFE'},
    {id:'g28-2', t:'수입 구조 안정화 (연 수입 1억 방향)', sub:'인세 + 구독료 + 강연료 파이프라인 형성', bg:'#FAEEDA'}
  ]}
};

function toggleState(key) {
  var current = localStorage.getItem(key) === 'true';
  localStorage.setItem(key, !current);
}
function getState(key) {
  return localStorage.getItem(key) === 'true';
}

function showLv(id) {
  document.querySelectorAll('.lv').forEach(function(l){ l.classList.remove('on'); });
  document.getElementById('lv-'+id).classList.add('on');
  curLv = id;
  updBc();
}

function updBc() {
  var path = [];
  path.push({l:'홈', fn: curLv==='home' ? null : 'goHome()'});
  if (['years','year'].indexOf(curLv) >= 0) path.push({l:'연도별 플랜', fn:'goYears()'});
  if (curLv==='year') path.push({l:curYear+'년 마스터', fn:null});
  
  document.getElementById('bc').innerHTML = path.map(function(p,i){
    return '<span class="bci'+(i===path.length-1?' on':'')+'" '+(p.fn?'onclick="'+p.fn+'"':'')+'>'+ p.l+'</span>'+(i<path.length-1?'<span class="bcs"> › </span>':'');
  }).join('');
}

function goHome() { renderHome(); }

function renderHome() {
  var h = `
    <div class="sc-card">
      <div class="sc-vision" style="color:#FFF">"이야기로 세상과 연결되고, 글로 생계를 만들며, 공간으로 다음 세대를 키운다."</div>
      <div class="sc-row">
        <div class="sc-stat"><div class="sc-stat-label">수입 기반</div><div class="sc-stat-val">현재 구조 정비</div></div>
        <div class="sc-stat"><div class="sc-stat-label">핵심 IP</div><div class="sc-stat-val">경장편 소설</div></div>
        <div class="sc-stat"><div class="sc-stat-label">최종 종착지</div><div class="sc-stat-val">작은 우주의 주인</div></div>
      </div>
    </div>
    <div class="sec-label">계획 레이어</div>
    <div class="dw-grid">
      <div class="dw" onclick="goYears()">
        <div class="dw-title" style="font-weight:600">📅 2026 — 2028 중단기 탑다운 마스터 목표 보기 <span class="now-badge">진입</span></div>
        <div style="font-size:11px;color:#888780;margin-top:4px">클릭하여 연도별 세부 체크리스트를 확인하고 관리하세요.</div>
      </div>
    </div>
  `;
  document.getElementById('lv-home').innerHTML = h;
  showLv('home');
}

function goYears() {
  var h = '<div class="yr-list">';
  [2026, 2027, 2028].forEach(function(yr) {
    var y = YG[yr];
    h += `<div class="yc" onclick="goYear(${yr})" style="cursor:pointer">
      <div class="yc-head">
        <div><span style="font-size:15px;font-weight:600">${yr}년</span> <span style="font-size:12px;color:#888780;margin-left:6px">"${y.keyword}"</span></div>
        <span style="color:#B4B2A9">▶</span>
      </div>
    </div>`;
  });
  h += '</div>';
  document.getElementById('lv-years').innerHTML = h;
  showLv('years');
}

function goYear(yr) {
  curYear = yr;
  var y = YG[yr];
  var h = `<div style="font-size:14px;font-weight:600;margin-bottom:12px;color:#5F5E5A">${yr}년 핵심 이정표 (클릭 시 토글 저장)</div>`;
  
  y.goals.forEach(function(g) {
    var isDone = getState(g.id);
    h += `
      <div class="goal-item ${isDone?'done':''}" onclick="toggleGoal('${g.id}', ${yr})" style="background:${g.bg}">
        <div class="g-chk"></div>
        <div style="flex:1">
          <div class="g-text">${g.t}</div>
          <div class="g-sub">${g.sub}</div>
        </div>
      </div>
    `;
  });
  document.getElementById('lv-year').innerHTML = h;
  showLv('year');
}

function toggleGoal(id, yr) {
  toggleState(id);
  goYear(yr);
}

renderHome();
</script>
</div>
</body>
</html>
