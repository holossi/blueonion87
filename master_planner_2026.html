<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 마스터 플래너</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#DDD8CE;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#2C2C2A}
.lv{display:none}.lv.on{display:block}
.top-label{font-size:10px;font-weight:500;color:#B4B2A9;letter-spacing:.06em;margin-bottom:3px}
.top-title{font-size:17px;font-weight:500;color:#2C2C2A;margin-bottom:3px}
.top-desc{font-size:11px;color:#B4B2A9;margin-bottom:1.25rem;font-style:italic}
.mf{background:#EDE8DE;border-radius:10px;padding:9px 13px;margin-bottom:1.25rem;font-size:12px;color:#5F5E5A;font-style:italic}
.bc{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-bottom:1rem;font-size:11px}
.bci{cursor:pointer;color:#888780}.bci:hover{color:#2C2C2A}.bci.on{color:#2C2C2A;font-weight:500;cursor:default}
.bcs{color:#D3D1C7}
.back-btn{font-size:11px;padding:5px 12px;border:0.5px solid #D3D1C7;border-radius:14px;background:#F5F0E8;color:#888780;cursor:pointer;margin-bottom:1rem;display:inline-flex;align-items:center;gap:4px}
.back-btn:hover{border-color:#888780;color:#2C2C2A}
.sec-label{font-size:10px;font-weight:500;color:#B4B2A9;letter-spacing:.04em;margin-bottom:8px;margin-top:1.25rem}
.sec-label:first-child,.sec-label-first{margin-top:0}
.card{border:0.5px solid #D3D1C7;border-radius:12px;padding:13px 15px;background:#FDFAF6;margin-bottom:8px}
.card-title{font-size:13px;font-weight:500;color:#2C2C2A;margin-bottom:4px}
.card-body{font-size:12px;color:#5F5E5A;line-height:1.6}
.chip{font-size:10px;font-weight:500;padding:2px 7px;border-radius:8px}
.tag{font-size:10px;font-weight:500;padding:2px 8px;border-radius:8px;display:inline-block}
.now-badge{font-size:9px;font-weight:500;padding:1px 6px;border-radius:8px;background:#FAEEDA;color:#854F0B;margin-left:5px}
.sc-card{border-radius:12px;padding:16px;background:#2C2C2A;margin-bottom:1rem}
.sc-vision{font-size:13px;color:#F5F0E8;line-height:1.7;font-style:italic;margin-bottom:12px}
.sc-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sc-stat{background:rgba(255,255,255,.07);border-radius:8px;padding:8px 10px;text-align:center}
.sc-stat-label{font-size:9px;color:#888780;margin-bottom:3px}
.sc-stat-val{font-size:13px;font-weight:500;color:#F5F0E8}
.sc-stat-goal{font-size:9px;color:#639922;margin-top:3px}
.dw-grid{display:flex;flex-direction:column;gap:8px;margin-bottom:1rem}
.dw{border-radius:12px;padding:13px 15px;border:0.5px solid transparent;cursor:pointer}
.dw-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.dw-title{font-size:13px;font-weight:500;color:#2C2C2A;margin-bottom:3px}
.dw-desc{font-size:11px;color:#888780;font-style:italic;margin-bottom:7px}
.risk-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:1rem}
.rc{border-radius:10px;padding:11px 13px}
.rc-title{font-size:12px;font-weight:500;margin-bottom:3px}
.rc-level{font-size:10px;font-weight:500;padding:1px 6px;border-radius:8px;display:inline-block;margin-bottom:5px}
.rc-desc{font-size:11px;line-height:1.5}
.yr-list{display:flex;flex-direction:column;gap:8px;margin-bottom:1rem}
.yc{border:0.5px solid #D3D1C7;border-radius:12px;padding:13px 15px;background:#FDFAF6}
.yc.cur{border-color:#BA7517;background:#FDFBF5}
.yc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.goal-item{display:flex;align-items:flex-start;gap:8px;padding:7px 10px;border-radius:8px;cursor:pointer;margin-bottom:3px}
.g-chk{width:14px;height:14px;border-radius:3px;border:1.5px solid rgba(0,0,0,.15);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center}
.goal-item.done .g-chk{background:#639922;border-color:#639922}
.goal-item.done .g-chk::after{content:'';display:block;width:6px;height:4px;border-left:1.5px solid #fff;border-bottom:1.5px solid #fff;transform:rotate(-45deg) translateY(-1px)}
.g-text{font-size:12px;color:#2C2C2A;line-height:1.4}
.goal-item.done .g-text{text-decoration:line-through;color:#B4B2A9}
.g-sub{font-size:10px;color:#B4B2A9;margin-top:2px}
.sn-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:1.25rem}
.sn{border-radius:12px;padding:13px 15px;cursor:pointer;border:0.5px solid transparent}
.sn:hover{border-color:rgba(0,0,0,.12)}
.sg-item{display:flex;align-items:flex-start;gap:7px;padding:8px 12px;border-radius:10px;background:#FDFAF6;border:0.5px solid #EDE8DE;margin-bottom:5px;cursor:pointer}
.sg-chk{width:14px;height:14px;border-radius:3px;border:1.5px solid #D3D1C7;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;background:#FDFAF6}
.sg-item.done .sg-chk{background:#639922;border-color:#639922}
.sg-item.done .sg-chk::after{content:'';display:block;width:6px;height:4px;border-left:1.5px solid #fff;border-bottom:1.5px solid #fff;transform:rotate(-45deg) translateY(-1px)}
.sg-text{font-size:12px;color:#2C2C2A;flex:1;line-height:1.4}
.sg-item.done .sg-text{text-decoration:line-through;color:#B4B2A9}
.sg-badge{font-size:9px;font-weight:500;padding:1px 6px;border-radius:8px;flex-shrink:0;margin-top:2px}
.mo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:1.25rem}
.mc{border:0.5px solid #D3D1C7;border-radius:12px;padding:11px 13px;background:#FDFAF6;cursor:pointer}
.mc:hover{border-color:#888780}
.pace-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:1rem}
.pace{background:#EDE8DE;border-radius:8px;padding:8px 10px}
.pace-label{font-size:9px;font-weight:500;color:#B4B2A9;margin-bottom:2px}
.pace-val{font-size:13px;font-weight:500;color:#2C2C2A}
.pace-sub{font-size:10px;color:#B4B2A9;margin-top:1px}
.track{border:0.5px solid #D3D1C7;border-radius:12px;padding:12px 14px;background:#FDFAF6;margin-bottom:8px}
.track-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;padding-bottom:7px;border-bottom:0.5px solid #EDE8DE}
.tl{display:flex;align-items:center;gap:6px}
.td{width:7px;height:7px;border-radius:50%}
.tn{font-size:12px;font-weight:500;color:#2C2C2A}
.tt{font-size:9px;font-weight:500;padding:2px 7px;border-radius:8px}
.task{display:flex;align-items:flex-start;gap:7px;padding:5px 0;border-bottom:0.5px solid #EDE8DE;cursor:pointer}
.task:hover .task-text{text-decoration-style:dotted}
.task:last-child{border-bottom:none}
.chk{width:14px;height:14px;border-radius:3px;border:1.5px solid #D3D1C7;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;background:#FDFAF6}
.chk.done{background:#639922;border-color:#639922}
.chk.done::after{content:'';display:block;width:6px;height:4px;border-left:1.5px solid #fff;border-bottom:1.5px solid #fff;transform:rotate(-45deg) translateY(-1px)}
.task-text{font-size:11px;color:#5F5E5A;line-height:1.4;flex:1}
.task-text.done{text-decoration:line-through;opacity:.45}
.task-badge{font-size:9px;font-weight:500;padding:1px 5px;border-radius:6px;flex-shrink:0;margin-top:2px;background:#EDE8DE;color:#888780}
.task-badge.now{background:#FAEEDA;color:#854F0B}
.wk-list{display:flex;flex-direction:column;gap:6px;margin-bottom:1rem}
.wkc{border:0.5px solid #D3D1C7;border-radius:12px;padding:11px 13px;background:#FDFAF6;cursor:pointer}
.wkc:hover{border-color:#888780}
.wkc.cur{border-color:#BA7517;background:#FDFBF5}
.end-card{background:#EDE8DE;border-radius:12px;padding:12px 14px;margin-top:.5rem}
.prog-wrap{margin-bottom:1rem}
.prog-row{display:flex;justify-content:space-between;font-size:11px;color:#888780;margin-bottom:4px}
.prog-track{height:4px;background:#EDE8DE;border-radius:2px;overflow:hidden}
.prog-bar{height:100%;border-radius:2px;transition:width .3s}


.page-wrap{max-width:700px;margin:0 auto;background:#F5F0E8;min-height:100vh;padding:1.5rem 1.5rem 1.5rem;position:relative}

/* ── 할 일 추가 ── */
.add-task-row{display:flex;gap:6px;padding:7px 0 2px;border-top:0.5px dashed #EDE8DE;margin-top:4px}
.add-task-inp{flex:1;height:28px;border:0.5px solid #D3D1C7;border-radius:7px;padding:0 9px;font-size:11px;background:#F5F0E8;color:#2C2C2A}
.add-task-inp:focus{outline:none;border-color:#888780}
.add-task-btn{height:28px;width:28px;border:0.5px solid #D3D1C7;border-radius:7px;background:#F5F0E8;color:#888780;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.add-task-btn:hover{border-color:#888780;color:#2C2C2A}
.task-del{cursor:pointer;color:#D3D1C7;font-size:11px;margin-left:4px;flex-shrink:0;padding:2px}
.task-next{cursor:pointer;color:#D3D1C7;font-size:12px;margin-left:2px;flex-shrink:0;padding:2px}
.task-next:hover{color:#BA7517}
.task-date{font-size:10px;color:#B4B2A9;margin-left:4px;flex-shrink:0;white-space:nowrap}
.task-del:hover{color:#9B3020}


.track.drag-over{border:1.5px dashed #BA7517;background:#FDFAF6}
.track.drag-over .track-head{opacity:.6}
.drag-handle{cursor:grab;color:#C4B49A;font-size:12px;margin-right:4px;flex-shrink:0}
.task.drag-target{border:1px dashed #BA7517;background:#FDFAF6}
.drag-handle:active{cursor:grabbing}


.edit-inline{flex:1;border:none;border-bottom:1.5px solid #BA7517;background:transparent;font-size:11px;color:#2C2C2A;outline:none;padding:0 2px;min-width:0}



/* ── 카테고리/영역 태그 ── */
.cat-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-right:3px;margin-top:3px}
.area-tag{font-size:9px;padding:1px 6px;border-radius:6px;flex-shrink:0;white-space:nowrap;margin-right:3px}
.add-meta-row{display:flex;gap:4px;flex-wrap:wrap;padding:5px 0 2px;align-items:center}
.cat-btn{font-size:10px;padding:2px 9px;border-radius:10px;border:0.5px solid #D3D1C7;background:#FDFAF6;color:#888780;cursor:pointer;transition:all .12s}
.cat-btn.sel-work{background:#FAEEDA;border-color:#BA7517;color:#854F0B;font-weight:500}
.cat-btn.sel-personal{background:#DDF0FA;border-color:#1A6E9A;color:#0D4F73;font-weight:500}
.area-btn{font-size:10px;padding:2px 8px;border-radius:8px;border:0.5px solid #D3D1C7;background:#FDFAF6;color:#888780;cursor:pointer;transition:all .12s}
.area-btn.selected{border-color:#888780;color:#2C2C2A;background:#EDE8DE}
.meta-sep{color:#D3D1C7;font-size:11px;align-self:center}


/* ── 홈 화면 (index 스타일) ── */
.vision-card{background:#FDFAF6;border-radius:14px;padding:16px;margin-bottom:1rem;border:1px solid #C4B49A}
.vision-label{font-size:9px;font-weight:500;color:#B4A88A;letter-spacing:.06em;margin-bottom:6px}
.vision-text{font-size:13px;color:#5F5E5A;line-height:1.7;font-style:italic;margin-bottom:14px}
.vision-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.vs{background:#EDE8DE;border-radius:8px;padding:8px 10px;text-align:center}
.vs-label{font-size:9px;color:#B4B2A9;margin-bottom:3px}
.vs-val{font-size:13px;font-weight:500;color:#2C2C2A}
.vs-goal{font-size:9px;color:#3B6D11;margin-top:3px}
.phase-list{display:flex;flex-direction:column;gap:8px;margin-bottom:1.25rem}
.phase-card{border-radius:12px;padding:14px 16px;cursor:pointer;display:block;color:inherit;border:0.5px solid #D3D1C7;background:#EDE8DE;transition:border-color .15s,background .15s}
.phase-card:hover{border-color:#BA7517;background:#E0D9CC}
.phase-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.phase-years{font-size:10px;font-weight:500;color:#888780}
.phase-badge{font-size:9px;font-weight:500;padding:2px 7px;border-radius:8px;background:#D3D1C7;color:#5F5E5A}
.phase-title{font-size:14px;font-weight:500;color:#2C2C2A;margin-bottom:3px}
.phase-desc{font-size:11px;color:#888780;font-style:italic}
.now-dot2{font-size:9px;font-weight:500;padding:2px 7px;border-radius:8px;background:#FAEEDA;color:#854F0B;margin-left:6px}
.home-chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.home-chip{font-size:10px;padding:2px 8px;border-radius:8px;background:#D3D1C7;color:#5F5E5A}
.quote-card2{background:#EDE8DE;border-radius:12px;padding:14px 16px;margin-bottom:1rem}
.quote-label2{font-size:9px;font-weight:500;color:#B4B2A9;letter-spacing:.06em;margin-bottom:6px}
.quote-text2{font-size:12px;color:#5F5E5A;line-height:1.7;font-style:italic}
.quote-source2{font-size:10px;color:#B4B2A9;margin-top:5px}


/* ── AI 쪼개기 ── */
.api-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:9999;align-items:center;justify-content:center}
.api-modal.open{display:flex}
.api-box{background:#FDFAF6;border-radius:14px;padding:24px;width:300px;border:0.5px solid #D3D1C7;box-shadow:0 8px 24px rgba(0,0,0,.1)}
.api-box h3{font-size:14px;font-weight:500;color:#2C2C2A;margin-bottom:8px}
.api-box p{font-size:11px;color:#888780;margin-bottom:14px;line-height:1.6}
.api-inp{width:100%;border:0.5px solid #D3D1C7;border-radius:8px;padding:8px 10px;font-size:12px;background:#F5F0E8;color:#2C2C2A;margin-bottom:10px}
.api-inp:focus{outline:none;border-color:#888780}
.api-save{width:100%;padding:9px;border:none;border-radius:8px;background:#2C2C2A;color:#F5F0E8;font-size:13px;cursor:pointer}
.ai-loading{display:inline-block;width:11px;height:11px;border:2px solid #D3D1C7;border-top-color:#BA7517;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
/* 탑다운 쪼개기 버튼 */
.breakdown-wrap{display:flex;flex-direction:column;align-items:center;margin:1rem 0;gap:0}
.breakdown-line{width:1.5px;height:18px;background:#D3D1C7}
.breakdown-btn{display:flex;align-items:center;gap:6px;padding:8px 18px;border:1px solid #C4B49A;border-radius:20px;background:#FDFAF6;color:#888780;font-size:12px;cursor:pointer;transition:all .15s;white-space:nowrap}
.breakdown-btn:hover{border-color:#BA7517;color:#BA7517;background:#FAEEDA}
.breakdown-btn:disabled{opacity:.4;cursor:not-allowed}
.breakdown-arrow{font-size:14px;color:#D3D1C7;line-height:1;margin-top:2px}
/* 태그 그룹 구분 */
.area-group-label{font-size:9px;font-weight:500;color:#B4B2A9;letter-spacing:.04em;padding:6px 0 2px;margin-top:4px}


.season-pick{font-size:11px;cursor:pointer;padding:2px 7px;border-radius:8px;flex-shrink:0;border:0.5px solid #D3D1C7;background:#FDFAF6;color:#B4B2A9;transition:all .15s;white-space:nowrap}
.season-pick:hover{border-color:#888780;color:#888780}
.season-pick.assigned{background:#EDE8DE;border-color:#888780;color:#2C2C2A}


.item-ai-btn{font-size:10px;cursor:pointer;color:#D3D1C7;flex-shrink:0;padding:2px 5px;border-radius:5px;transition:all .15s;border:0.5px solid transparent}
.item-ai-btn:hover{color:#BA7517;border-color:#BA7517;background:#FAEEDA}


/* ── 뷰 네비 바 ── */
.view-nav{position:sticky;top:0;z-index:50;display:flex;gap:4px;padding:10px 0;background:#F5F0E8;border-bottom:0.5px solid #EDE8DE;margin-bottom:1rem;overflow-x:auto;scrollbar-width:none}
.view-nav::-webkit-scrollbar{display:none}
.vnav-btn{font-size:11px;padding:5px 12px;border:0.5px solid #D3D1C7;border-radius:14px;background:#FDFAF6;color:#888780;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .12s}
.vnav-btn:hover{border-color:#888780;color:#2C2C2A}
.vnav-btn.active{background:#2C2C2A;color:#F5F0E8;border-color:#2C2C2A}

</style>
</head>
<body>
<div class="page-wrap">


<div class="view-nav" id="viewNav">
  <button class="vnav-btn" id="vnav-home" onclick="goHome()">홈</button>
  <button class="vnav-btn" id="vnav-years" onclick="goYears()">3년</button>
  <button class="vnav-btn" id="vnav-year" onclick="goYear(curYear||2026)">연간</button>
  <button class="vnav-btn" id="vnav-season" onclick="goSeason(curSeason||'summer')">계절</button>
  <button class="vnav-btn" id="vnav-month" onclick="goMonth(curMonth||'june')">월간</button>
  <button class="vnav-btn" id="vnav-week" onclick="goWeek(curWeek||'setup')">주간</button>
</div>

<div class="api-modal" id="apiModal">
  <div class="api-box">
    <h3>✦ Claude API 키 설정</h3>
    <p>AI 쪼개기 기능을 사용하려면 Anthropic API 키가 필요해요.<br>이 기기 브라우저에만 저장돼요.</p>
    <input class="api-inp" id="apiKeyInp" type="password" placeholder="sk-ant-...">
    <button class="api-save" onclick="saveApiKey()">저장하고 시작하기</button>
  </div>
</div>


<div class="bc" id="bc"></div>

<div id="lv-home" class="lv on"></div>
<div id="lv-years" class="lv"></div>
<div id="lv-year" class="lv"></div>
<div id="lv-season" class="lv"></div>
<div id="lv-month" class="lv"></div>
<div id="lv-week" class="lv"></div>

<script>

// ── STATE 관리 (localStorage) ──────────────────────────
var STATE = {tasks:{}, goals:{}, custom:{}};
(function(){
  try {
    var s = JSON.parse(localStorage.getItem('planner-state')||'{}');
    STATE.tasks     = s.tasks     || {};
    STATE.goals     = s.goals     || {};
    STATE.custom    = s.custom    || {};
    STATE.deleted   = s.deleted   || {};
    STATE.allItems  = s.allItems  || {};
    STATE.editId    = null;

  } catch(e) {}
})();
function saveState(){ localStorage.setItem('planner-state', JSON.stringify(STATE)); }

function addCustomTask(key) {
  var safeId = key.replace(/[|:]/g,'_');
  var inp = document.getElementById('add-inp-'+safeId);
  var val = (inp ? inp.value : '').trim();
  if(!val) return;
  var cat  = _catSel[safeId]  || null;
  var area = _areaSel[safeId] || null;
  if(!STATE.allItems) STATE.allItems = {};
  if(!STATE.allItems[key]) STATE.allItems[key] = [];
  STATE.allItems[key].push({id:'ci_'+Date.now()+'_'+Math.random().toString(36).slice(2,6), text:val, cat:cat, area:area});
  _catSel[safeId]=null; _areaSel[safeId]=null;
  saveState(); refreshView(key);
}
function delCustomTask(key, idx) {
  if(STATE.custom[key]) { STATE.custom[key].splice(idx,1); saveState(); }
  var parts = key.split('|');
  if(parts[0]==='wk') goWeek(parts[1]);
  else if(parts[0]==='mo') goMonth(curMonth);
  else if(parts[0]==='se') goSeason(curSeason);
}



// ── 통합 아이템 관리 ──────────────────────────────────
function getAllItems(ck, src, sub) {
  if(!STATE.allItems) STATE.allItems = {};
  if(STATE.allItems[ck]) {
    // 캐시된 아이템에 GOAL_META 없으면 자동 적용
    STATE.allItems[ck].forEach(function(item){
      if(item.cat===undefined && GOAL_META[item.id]) {
        item.cat=GOAL_META[item.id].cat; item.area=GOAL_META[item.id].area;
      }
    });
    return STATE.allItems[ck];
  }
  var items = [];
  var prefix = ck.split('|')[0];
  if(prefix==='wk' && sub!=='etc') {
    var ti=parseInt(sub), tr=WD[src]&&WD[src].tracks&&WD[src].tracks[ti];
    if(tr) tr.tasks.forEach(function(t,i){ var old='wk:'+src+':'+ti+':'+i; if(!STATE.deleted[old]) items.push({id:old,text:t.t}); });
  } else if(prefix==='mo') {
    var ti=parseInt(sub), tr=MD[src]&&MD[src].tracks&&MD[src].tracks[ti];
    if(tr) tr.tasks.forEach(function(t,i){ var old='mo:'+src+':'+ti+':'+i; if(!STATE.deleted[old]) items.push({id:old,text:t.t}); });
  } else if(prefix==='se') {
    var gs=SG[src]&&SG[src].goals;
    if(gs) gs.forEach(function(g,i){
      var old='se:'+src+':'+i; if(STATE.deleted[old]) return;
      var m=GOAL_META[old]||{}; items.push({id:old,text:g.t,cat:m.cat||null,area:m.area||null});
    });
  } else if(prefix==='ys') {
    // yr|{year} 항목을 계절 태그 기준으로 분배 (최초 1회)
    var yKey='yr|'+src;
    var yrItems = getAllItems(yKey, parseInt(src), null);
    yrItems.forEach(function(it){
      var s = it.season==='spring27' ? 'spring' : (it.season||'spring');
      if(s===sub) items.push({id:it.id, text:it.text, cat:it.cat||null, area:it.area||null, season:it.season||null});
    });
  } else if(prefix==='yr') {
    var gs=YG[parseInt(src)]&&YG[parseInt(src)].goals;
    if(gs) gs.forEach(function(g,i){
      var old='yr:'+src+':'+i; if(STATE.deleted[old]) return;
      var m=GOAL_META[old]||{}; items.push({id:old,text:g.t,cat:m.cat||null,area:m.area||null});
    });
  }
  (STATE.custom[ck]||[]).forEach(function(ct){
    var txt=(typeof ct==='object')?ct.t:ct;
    items.push({id:'ci_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),text:txt});
  });
  STATE.allItems[ck]=items; STATE.custom[ck]=[];
  return items;
}

// ── 드래그앤드롭 ──────────────────────────────────────
var _di = null; // {ck, idx}
function onItemDragStart(e, ck, idx) {
  _di = {ck:ck, idx:idx};
  e.dataTransfer.effectAllowed = 'move';
  e.stopPropagation();
}
function onItemDragOver(e, ck, idx) {
  if(!_di) return;
  e.preventDefault(); e.stopPropagation();
  document.querySelectorAll('.task').forEach(function(el){ el.classList.remove('drag-target'); });
  var el = document.getElementById('item-'+ck.replace(/[|:]/g,'_')+'-'+idx);
  if(el) el.classList.add('drag-target');
}
function onItemDrop(e, ck, idx) {
  e.preventDefault(); e.stopPropagation();
  document.querySelectorAll('.task').forEach(function(el){ el.classList.remove('drag-target'); });
  if(!_di) return;
  var srcCk = _di.ck, srcIdx = _di.idx;
  if(srcCk === ck && srcIdx === idx) { _di=null; return; }
  if(!STATE.allItems[srcCk]) { _di=null; return; }
  var item = STATE.allItems[srcCk].splice(srcIdx,1)[0];
  if(!STATE.allItems[ck]) STATE.allItems[ck] = [];
  var ti = (srcCk===ck && srcIdx<idx) ? idx-1 : idx;
  STATE.allItems[ck].splice(ti,0,item);
  _di = null;
  saveState(); refreshView(ck);
}
function onTrackDropEnd(e, ck) {
  e.preventDefault(); e.stopPropagation();
  document.querySelectorAll('.task').forEach(function(el){ el.classList.remove('drag-target'); });
  if(!_di) return;
  if(!STATE.allItems[_di.ck]) { _di=null; return; }
  var item = STATE.allItems[_di.ck].splice(_di.idx,1)[0];
  if(!STATE.allItems[ck]) STATE.allItems[ck] = [];
  STATE.allItems[ck].push(item);
  _di = null;
  saveState(); refreshView(ck);
}

// ── 뷰 새로고침 ──────────────────────────────────────
function refreshView(ck) {
  var p = ck.split('|')[0];
  if(p==='wk') goWeek(curWeek);
  else if(p==='mo') goMonth(curMonth);
  else if(p==='se') goSeason(curSeason);
  else if(p==='yr') goYear(curYear);
}

// ── 인라인 편집 ──────────────────────────────────────
function startEdit(id, ck) {
  STATE.editId = id+'|'+ck;
  refreshView(ck);
  setTimeout(function(){
    var el=document.getElementById('ei-'+id.replace(/[|:]/g,'_'));
    if(el){el.focus();el.select();}
  },50);
}
function saveItemEdit(id, ck) {
  var idSafe=id.replace(/[|:]/g,'_');
  var el=document.getElementById('ei-'+idSafe);
  if(!el) return;
  var val=el.value.trim();
  var meta=_editMeta[idSafe]||{};
  if(STATE.allItems && STATE.allItems[ck]) {
    STATE.allItems[ck].forEach(function(item){
      if(item.id!==id) return;
      if(val) item.text=val;
      if(meta.cat!==undefined) item.cat=meta.cat;
      if(meta.area!==undefined) item.area=meta.area;
    });
  }
  delete _editMeta[idSafe];
  STATE.editId=null; saveState(); refreshView(ck);
}
function cancelEdit(ck) { STATE.editId=null; refreshView(ck); }

// ── 통합 아이템 렌더러 ──────────────────────────────
function renderItem(item, itemIdx, ck, isGoal) {
  var done = isGoal ? STATE.goals[item.id] : STATE.tasks[item.id];
  var isEditing = STATE.editId === item.id+'|'+ck;
  var ckSafe = ck.replace(/[|:]/g,'_');
  var idSafe = item.id.replace(/[|:]/g,'_');
  var safeText = item.text.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;');
  var itemElId = 'item-'+ckSafe+'-'+itemIdx;
  var chkClass = isGoal ? 'sg-chk' : 'chk';
  var h = '<div class="task" id="'+itemElId+'" draggable="true"';
  h += ' ondragstart="onItemDragStart(event,\''+ck+'\','+itemIdx+')"';
  h += ' ondragover="onItemDragOver(event,\''+ck+'\','+itemIdx+')"';
  h += ' ondrop="onItemDrop(event,\''+ck+'\','+itemIdx+')"';
  h += ' onclick="handleClick(this,\''+item.id+'\','+isGoal+')"';
  h += ' ondblclick="handleDblClick(event,\''+item.id+'\',\''+ck+'\')">';
  h += '<span class="drag-handle">⠿</span>';
  h += '<div class="'+chkClass+(done?' done':'')+'">'+'</div>';
  if(isEditing) {
    if(!_editMeta[idSafe]) _editMeta[idSafe]={cat:item.cat,area:item.area};
    var em=_editMeta[idSafe];
    h += '<div style="flex:1;display:flex;flex-direction:column;gap:3px">';
    h += '<input class="edit-inline" id="ei-'+idSafe+'" value="'+safeText+'" onclick="event.stopPropagation()"';
    h += ' onkeydown="event.stopPropagation();if(event.key===\'Enter\')saveItemEdit(\''+item.id+'\',\''+ck+'\');if(event.key===\'Escape\')cancelEdit(\''+ck+'\')"/>';
    h += '<div class="add-meta-row" style="padding:0;margin-top:2px">';
    ALL_AREAS.forEach(function(a,i){
      var eac=AREA_COLORS[a]||{bg:'#EDE8DE',tc:'#888780'};
      var sel=em.area===a;
      h+='<button class="area-btn" id="earea-'+i+'-'+idSafe+'"';
      h+=' style="background:'+(sel?eac.tc:eac.bg)+';color:'+(sel?'#fff':eac.tc)+';border-color:'+eac.bg+'"';
      h+=' onclick="event.stopPropagation();setEditMeta(\''+idSafe+'\',\'area\',\''+a+'\')">'+(a)+'</button>';
    });
    h += '</div></div>';
    h += '<span class="task-edit" onclick="event.stopPropagation();saveItemEdit(\''+item.id+'\',\''+ck+'\')" style="color:#BA7517">✓</span>';
  } else {
    h += '<div class="task-text'+(done?' done':'')+'" style="flex:1">'+item.text+'</div>';
    if(ck.split('|')[0]==='yr'){
      var se=item.season||null;
      var seE=se?SEASON_EMOJI[se]:'계절';
      h+='<span class="season-pick'+(se?' assigned':'')+'" onclick="event.stopPropagation();cycleSeason(\''+item.id+'\',\''+ck+'\')">'+seE+'</span>';
    }
    if(item.area){ var ac2=AREA_COLORS[item.area]||{bg:'#EDE8DE',tc:'#888780'}; h += '<span class="area-tag" style="background:'+ac2.bg+';color:'+ac2.tc+'">'+item.area+'</span>'; }
  }
  var isWk = ck.split('|')[0]==='wk';
  var srcId = ck.split('|')[1];
  if(isWk) h += '<span class="task-next" onclick="event.stopPropagation();moveItemToNextWeek(\''+ck+'\','+itemIdx+',\''+srcId+'\')" title="다음 주로">→</span>';
  var safeTextAi = item.text.replace(/'/g,"\\'").replace(/"/g,'&quot;');
  var areaAi = item.area||'';
  h += '<span class="item-ai-btn" onclick="event.stopPropagation();breakdownItem(\''+safeTextAi+'\',\''+areaAi+'\')" title="주간 할일로 쪼개기">✦</span>';
  h += '<span class="task-del" onclick="event.stopPropagation();delItem(\''+ck+'\','+itemIdx+',null)" title="삭제">✕</span>';
  h += '</div>';
  return h;
}


var _clickTimer = null;
function handleClick(el, id, isGoal) {
  if(_clickTimer) { clearTimeout(_clickTimer); _clickTimer = null; return; }
  _clickTimer = setTimeout(function() {
    _clickTimer = null;
    togUnified(el, id, isGoal);
  }, 220);
}
function handleDblClick(e, id, ck) {
  e.stopPropagation();
  if(_clickTimer) { clearTimeout(_clickTimer); _clickTimer = null; }
  startEdit(id, ck);
}

function togUnified(el, id, isGoal) {
  var c=el.querySelector('.chk,.sg-chk'), t=el.querySelector('.task-text');
  if(!c) return;
  c.classList.toggle('done'); if(t) t.classList.toggle('done');
  if(isGoal){ STATE.goals[id]=c.classList.contains('done'); }
  else { STATE.tasks[id]=c.classList.contains('done'); }
  saveState();
}

function showLv(id) {
  document.querySelectorAll('.lv').forEach(function(l){ l.classList.remove('on'); });
  document.getElementById('lv-'+id).classList.add('on');
  curLv = id;
  updBc();
}

function updBc() {
  var path = [];
  path.push({l:'홈', fn: curLv==='home' ? null : 'goHome()'});
  if (['years','year','season','month','week'].indexOf(curLv) >= 0) path.push({l:'연도별 목표', fn:'goYears()'});
  if (['year','season','month','week'].indexOf(curLv) >= 0) path.push({l:curYear+'년', fn:'goYear('+curYear+')'});
  if (['season','month','week'].indexOf(curLv) >= 0) path.push({l:SG[curSeason].name, fn:"goSeason('"+curSeason+"')"});
  if (['month','week'].indexOf(curLv) >= 0) path.push({l:MD[curMonth].name, fn:"goMonth('"+curMonth+"')"});
  if (curLv === 'week') path.push({l:WD[curWeek].label, fn:null});
  path[path.length-1].fn = null;
  document.getElementById('bc').innerHTML = path.map(function(p,i){
    return '<span class="bci'+(i===path.length-1?' on':'')+'" '+(p.fn?'onclick="'+p.fn+'"':'')+' style="'+(p.fn?'':'cursor:default')+'">'+ p.l+'</span>'+(i<path.length-1?'<span class="bcs"> › </span>':'');
  }).join('');
}

if(location.hash==='#week'){

// ── API 키 관리 ────────────────────────────────────────
var AREAS_LIST_ALL = ['소설','뉴스레터/에세이','유튜브','공간 운영','독립/거주','건강/뷰티','성장/배움','기쁨/쉼'];

function getApiKey(){ return localStorage.getItem('claude-api-key')||''; }
function saveApiKey(){
  var k=document.getElementById('apiKeyInp').value.trim();
  if(!k) return;
  localStorage.setItem('claude-api-key',k);
  document.getElementById('apiModal').classList.remove('open');
  if(window._apiKeyCallback){ window._apiKeyCallback(); window._apiKeyCallback=null; }
}
function checkApiKey(cb){
  if(getApiKey()){ cb(); return; }
  document.getElementById('apiModal').classList.add('open');
  document.getElementById('apiModal').onclick=function(e){ if(e.target===this) this.classList.remove('open'); };
  window._apiKeyCallback=cb;
}
async function callClaude(prompt, btnId, btnLabel){
  var key=getApiKey(); if(!key) return null;
  if(btnId){ var b=document.getElementById(btnId); if(b){b.disabled=true;b.innerHTML='<span class="ai-loading"></span> 생성 중...';} }
  try{
    var res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:1500,messages:[{role:'user',content:prompt}]})
    });
    if(!res.ok){ alert('API 오류: '+res.status); return null; }
    var data=await res.json();
    return data.content[0].text;
  } catch(e){ alert('오류: '+e.message); return null; }
  finally{ if(btnId){ var b=document.getElementById(btnId); if(b){b.disabled=false;b.innerHTML=btnLabel;} } }
}

// ── 태그별 정렬 ─────────────────────────────────────────
function sortByArea(ck){
  if(!STATE.allItems||!STATE.allItems[ck]) return;
  var order=AREAS_LIST_ALL;
  STATE.allItems[ck].sort(function(a,b){
    var ai=a.area?order.indexOf(a.area):999;
    var bi=b.area?order.indexOf(b.area):999;
    return ai-bi;
  });
  saveState(); refreshView(ck);
}

// ── 연간 → 계절 쪼개기 ──────────────────────────────────
function breakdownYearToSeason(yr){
  checkApiKey(async function(){
    var yrck='yr|'+yr;
    var items=STATE.allItems[yrck]||[];
    if(!items.length){ alert('연간 목표를 먼저 입력해주세요.'); return; }
    var goalText=items.map(function(i,n){
      var sn=i.season?(SEASON_NAME[i.season]+' 지정'):'계절 미지정(AI 판단)';
      return (n+1)+'. '+i.text+(i.area?' ['+i.area+']':'')+' ('+sn+')';
    }).join('\n');
    var seAssigned = {};
    var seUnassigned = [];
    items.forEach(function(i){
      if(i.season){
        var sn=SEASON_NAME[i.season];
        if(!seAssigned[sn]) seAssigned[sn]=[];
        seAssigned[sn].push(i.text);
      } else { seUnassigned.push(i.text); }
    });
    var assignedText = Object.keys(seAssigned).map(function(s){ return s+': '+seAssigned[s].join(', '); }).join('\n');
    var unassignedText = seUnassigned.length ? seUnassigned.join('\n') : '없음';
    var prompt='다음은 '+yr+'년 연간 목표야.\n\n'
      +'[계절 지정된 목표] (반드시 해당 계절에 포함):\n'+assignedText+'\n\n'
      +'[계절 미지정 목표] (AI가 적합한 계절 선택):\n'+unassignedText+'\n\n'
      +'규칙:\n'
      +'1. 지정 계절 목표는 반드시 해당 계절에 넣어줘 (문장 그대로 또는 약간 다듬기)\n'
      +'2. 미지정 목표는 여름→가을→겨울 타임라인 흐름에 따라 자연스럽게 분산 배치\n'
      +'   (한 계절에 몰아넣지 말고, 시간 순서대로 나누어 배치)\n'
      +'3. 각 계절은 2~4개 목표. 계절 전체 단위 (월별 X, 주별 X)\n'
      +'4. 영역 태그: '+AREAS_LIST_ALL.join(', ')+'\n\n'
      +'JSON만 응답:\n'
      +'{"여름":[{"text":"목표","area":"태그"}],"가을":[...],"겨울":[...],"봄":[...]}';
    var result=await callClaude(prompt,'break-yr-'+yr,'⤵ AI로 계절별 쪼개기');
    if(!result) return;
    try{
      var data=JSON.parse(result.replace(/```json|```/g,'').trim());
      var seMap={'여름':'summer','가을':'autumn','겨울':'winter','봄':'spring'};
      Object.keys(data).forEach(function(s){
        var season=seMap[s]; if(!season) return;
        var sck='ys|'+yr+'|'+season;
        if(!STATE.allItems) STATE.allItems={};
        if(!STATE.allItems[sck]) STATE.allItems[sck]=[];
        data[s].forEach(function(item){
