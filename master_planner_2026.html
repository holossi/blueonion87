function showLv(id) {
  document.querySelectorAll('.lv').forEach(function(l){ l.classList.remove('on'); });
  document.getElementById('lv-'+id).classList.add('on');
  curLv = id;
  updBc();
}

function updBc() {
  var path = [];
  path.push({l:'홈', fn: curLv==='home' ? null : 'goHome()'});
  if (['years','year','season','month','week'].indexOf(curLv) >= 0) path.push({l:'연도별 목표', fn:'goYears()'});
  if (['year','season','month','week'].indexOf(curLv) >= 0) path.push({l:curYear+'년', fn:'goYear('+curYear+')'});
  if (['season','month','week'].indexOf(curLv) >= 0) path.push({l:SG[curSeason].name, fn:"goSeason('"+curSeason+"')"});
  if (['month','week'].indexOf(curLv) >= 0) path.push({l:MD[curMonth].name, fn:"goMonth('"+curMonth+"')"});
  if (curLv === 'week') path.push({l:WD[curWeek].label, fn:null});
  path[path.length-1].fn = null;
  document.getElementById('bc').innerHTML = path.map(function(p,i){
    return '<span class="bci'+(i===path.length-1?' on':'')+'" '+(p.fn?'onclick="'+p.fn+'"':'')+' style="'+(p.fn?'':'cursor:default')+'">'+ p.l+'</span>'+(i<path.length-1?'<span class="bcs"> › </span>':'');
  }).join('');
}

function goYears() {
  var h = '<button class="back-btn" onclick="goHome()">← 홈</button>';

  function buildSection(title, years) {
    var s = '<div class="sec-label sec-label-first">'+title+'</div><div class="yr-list">';
    years.forEach(function(yr) {
      var y = YG[yr];
      var goalsH = y.goals.map(function(g) {
        return '<div class="goal-item" onclick="togGoal(this)" style="background:'+g.bg+'"><div class="g-chk"></div><div><div class="g-text">'+g.t+'</div><div class="g-sub">'+g.sub+'</div></div></div>';
      }).join('');
      var clickable = yr <= 2028;
      s += '<div class="yc'+(y.active?' cur':'')+'">';
      s += '<div class="yc-head" '+(clickable?'onclick="goYear('+yr+')" style="cursor:pointer"':'style="cursor:default"')+'>';
      s += '<div><div style="font-size:16px;font-weight:500;color:#2C2C2A">'+yr+'년'+(y.active?'<span class="now-badge">지금</span>':'')+'</div>';
      s += '<div style="font-size:10px;font-weight:500;color:#B4B2A9;margin-top:1px">'+y.phase+'</div>';
      s += '<div style="font-size:11px;color:#888780;font-style:italic;margin-top:1px">"'+y.keyword+'"</div></div>';
      s += (clickable?'<span style="font-size:16px;color:#B4B2A9">›</span>':'')+'</div>';
      s += '<div style="margin-top:8px">'+goalsH+'</div></div>';
    });
    s += '</div>';
    return s;
  }

  h += buildSection('신해 대운 1단계 · 구조 전환기 (2026~2028)', [2026,2027,2028]);
  h += buildSection('신해 대운 2단계 · 확장기 (2029~2031)', [2029,2030,2031]);
  h += buildSection('신해 대운 3단계 · 수확 준비기 (2032~2034)', [2032,2033,2034]);

  document.getElementById('lv-years').innerHTML = h;
  showLv('years');
}

    h += '</div>';
  } else {
    h += '<div class="card" style="margin-top:1rem"><div class="card-body" style="color:#888780">상세 계획은 해당 계절이 다가올 때 업데이트해요.</div></div>';
  }
  document.getElementById('lv-season').innerHTML = h;
  showLv('season');
}

function goMonth(mid) {
  curMonth = mid;
  var m = MD[mid];
  var h = '<button class="back-btn" onclick="goSeason(\''+curSeason+'\')">← '+SG[curSeason].name+'</button>';
  h += '<div style="font-size:15px;font-weight:500;color:#2C2C2A;margin-bottom:3px">'+m.name+' · '+m.title+'</div>';
  h += '<div style="font-size:12px;color:#888780;font-style:italic;margin-bottom:1rem">'+m.mood+'</div>';
  h += '<div class="pace-row">'+m.paces.map(function(p){ return '<div class="pace"><div class="pace-label">'+p.l+'</div><div class="pace-val">'+p.v+'</div><div class="pace-sub">'+p.s+'</div></div>'; }).join('')+'</div>';
  m.tracks.forEach(function(tr) {
    h += '<div class="track"><div class="track-head"><div class="tl"><div class="td" style="background:'+tr.c+'"></div><div class="tn">'+tr.n+'</div></div><span class="tt" style="background:'+tr.tBg+';color:'+tr.tC+'">'+tr.tag+'</span></div>';
    tr.tasks.forEach(function(t) {
      h += '<div class="task" onclick="togT(this)"><div class="chk'+(t.done?' done':'')+'"></div><div class="task-text'+(t.done?' done':'')+'">'+t.t+'</div><span class="task-badge'+(t.now?' now':'')+'">'+t.b+'</span></div>';
    });
    h += '</div>';
  });
  h += '<div class="end-card"><div class="sec-label sec-label-first">'+m.name+' 끝에 확인</div>';
  m.ends.forEach(function(e) {
    h += '<div class="task" onclick="togT(this)" style="background:transparent"><div class="chk"></div><div class="task-text">'+e+'</div></div>';
  });
  h += '</div>';
  if (mid === 'june') {
    h += '<div class="sec-label">주간 선택</div><div class="wk-list">';
    ['setup','w1','w2','w3','w4'].forEach(function(wid) {
      var w = WD[wid];
      h += '<div class="wkc'+(w.cur?' cur':'')+'" onclick="goWeek(\''+wid+'\')"><div style="display:flex;align-items:center;justify-content:space-between"><div>';
      h += '<div style="font-size:10px;font-weight:500;color:#B4B2A9;margin-bottom:2px">'+w.label+' · '+w.dates+(w.cur?'<span class="now-badge">지금</span>':'')+'</div>';
      h += '<div style="font-size:13px;font-weight:500;color:#2C2C2A">'+w.title+'</div>';
      h += '<div style="font-size:11px;color:#888780;font-style:italic;margin-top:2px">'+w.mood+'</div>';
      h += '</div><span style="font-size:16px;color:#B4B2A9;margin-left:8px">›</span></div></div>';
    });
    h += '</div>';
  } else {
    h += '<div class="card" style="margin-top:.5rem"><div class="card-body" style="color:#888780">주간 계획은 해당 달에 업데이트해요.</div></div>';
  }
  document.getElementById('lv-month').innerHTML = h;
  showLv('month');
}

function goWeek(wid) {
  curWeek = wid;
  var w = WD[wid];
  var h = '<button class="back-btn" onclick="goMonth(\''+curMonth+'\')">← '+MD[curMonth].name+'</button>';
  h += '<div style="border-bottom:0.5px solid #D3D1C7;margin-bottom:1rem;padding-bottom:10px">';
  h += '<div style="font-size:15px;font-weight:500;color:#2C2C2A;margin-bottom:3px">'+w.label+' · '+w.dates+(w.cur?'<span class="now-badge">지금</span>':'')+'</div>';
  h += '<div style="font-size:12px;color:#888780;font-style:italic">'+w.mood+'</div></div>';
  w.tracks.forEach(function(tr) {
    h += '<div class="track"><div class="track-head"><div class="tl"><div class="td" style="background:'+tr.c+'"></div><div class="tn">'+tr.n+'</div></div><span class="tt" style="background:'+tr.tBg+';color:'+tr.tC+'">'+tr.tag+'</span></div>';
    tr.tasks.forEach(function(t) {
      h += '<div class="task" onclick="togT(this)"><div class="chk'+(t.done?' done':'')+'"></div><div class="task-text'+(t.done?' done':'')+'">'+t.t+'</div><span class="task-badge'+(t.now?' now':'')+'">'+t.b+'</span></div>';
    });
    h += '</div>';
  });
  h += '<div class="end-card"><div class="sec-label sec-label-first">이번 주 끝에 확인</div>';
  w.ends.forEach(function(e) {
    h += '<div class="task" onclick="togT(this)" style="background:transparent"><div class="chk"></div><div class="task-text">'+e+'</div></div>';
  });
  h += '</div>';
  document.getElementById('lv-week').innerHTML = h;
  showLv('week');
}

function togT(el) {
  var c = el.querySelector('.chk');
  var t = el.querySelector('.task-text');
  c.classList.toggle('done');
  if (t) t.classList.toggle('done');
}
function togSg(el) { el.classList.toggle('done'); el.querySelector('.sg-chk').classList.toggle('done'); }
function togGoal(el) { el.classList.toggle('done'); el.querySelector('.g-chk').classList.toggle('done'); }

renderHome();
if(location.hash==='#week'){
  goYear(2026);
  goSeason('summer');
  goMonth('june');
  goWeek('setup');
}
</script>
</body>
</html>
