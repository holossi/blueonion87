<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>인물 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --mist:#e9ebe9; --mist-2:#dfe2e1; --paper:#fcfcfa;
    --ink:#1f242c; --ink-soft:#5c6068; --faint:#9aa0a4;
    --line:#d8dcdb; --accent:#3f5a73; --accent-soft:#e4ecf1;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:radial-gradient(120% 80% at 50% -10%, #f3f4f2 0%, var(--mist) 55%, var(--mist-2) 100%);
    color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;line-height:1.6;
    min-height:100%;display:flex;justify-content:center;padding:20px 16px 48px;
  }
  .app{width:100%;max-width:460px}

  .top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;padding:0 2px}
  .brand{font-family:'Noto Serif KR',serif;font-weight:600;font-size:17px}
  .brand .sub{font-family:'Noto Sans KR';font-weight:400;color:var(--faint);font-size:12px;margin-left:8px}
  .saved{font-size:11px;color:var(--faint);opacity:0;transition:opacity .4s}
  .saved.show{opacity:1}

  .people{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
  .people::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:var(--paper);color:var(--ink-soft);
    font-size:13px;font-weight:500;padding:7px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:.18s}
  .chip:hover{border-color:#c3c8c7}
  .chip.active{background:var(--ink);color:#f6f6f4;border-color:var(--ink)}
  .chip.add{color:var(--accent);border-style:dashed}

  .card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:24px 22px 18px;
    box-shadow:0 1px 0 rgba(255,255,255,.6) inset, 0 8px 26px -18px rgba(31,36,44,.45)}
  .eyebrow{font-size:11px;letter-spacing:.06em;color:var(--accent);background:var(--accent-soft);
    display:inline-block;padding:4px 9px;border-radius:6px;font-weight:700;margin-bottom:16px}
  .question{font-family:'Noto Serif KR',serif;font-weight:500;font-size:21px;line-height:1.55;
    letter-spacing:-.01em;color:var(--ink);min-height:1.55em}
  textarea{width:100%;border:none;outline:none;resize:none;background:transparent;
    font-family:'Noto Sans KR',sans-serif;font-size:15px;line-height:1.85;color:var(--ink);
    margin-top:16px;min-height:150px;border-top:1px solid var(--line);padding-top:16px}
  textarea::placeholder{color:var(--faint)}

  .actions{display:flex;align-items:center;gap:10px;margin-top:14px}
  .draw{margin-left:auto;border:1px solid var(--line);background:var(--paper);color:var(--ink);
    font-family:inherit;font-size:13px;font-weight:500;padding:9px 15px;border-radius:10px;cursor:pointer;transition:.15s}
  .draw:hover{border-color:#bcc1c0;background:#fff}
  .draw .arr{color:var(--accent);margin-left:5px}
  .keep{font-size:12px;color:var(--faint)}

  .coll{margin-top:26px}
  .coll-head{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 12px}
  .coll-title{font-family:'Noto Serif KR',serif;font-size:14px;font-weight:600;color:var(--ink-soft)}
  .coll-count{font-size:12px;color:var(--faint)}
  .entry{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 15px;margin-bottom:9px;cursor:pointer;transition:.15s;position:relative}
  .entry:hover{border-color:#c7ccca}
  .entry .e-q{font-family:'Noto Serif KR',serif;font-size:13px;color:var(--ink-soft);line-height:1.5;margin-bottom:6px;padding-right:20px}
  .entry .e-t{font-size:14px;color:var(--ink);line-height:1.7;white-space:pre-wrap;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .entry .e-del{position:absolute;top:10px;right:10px;border:none;background:none;color:var(--faint);
    font-size:15px;cursor:pointer;line-height:1;padding:2px 4px}
  .entry .e-del:hover{color:#c0413a}

  .empty{text-align:center;padding:46px 18px}
  .empty .e-title{font-family:'Noto Serif KR',serif;font-size:19px;font-weight:500;margin-bottom:10px}
  .empty p{color:var(--ink-soft);font-size:14px;margin-bottom:22px;line-height:1.7}
  .coll-empty{text-align:center;color:var(--faint);font-size:13px;padding:18px 0}

  .row-actions{display:flex;justify-content:flex-end;margin-top:18px}
  .footer-bar{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:24px;opacity:.85}
  .footer-bar .dot{color:var(--faint)}
  .link.io{color:var(--ink-soft)}
  .link.io:hover{color:var(--accent)}
  .io-area{width:100%;height:230px;border:1px solid var(--line);border-radius:9px;padding:12px;
    font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.5;color:var(--ink);
    resize:none;outline:none;margin-top:6px;white-space:pre;overflow:auto}
  .io-area:focus{border-color:var(--accent)}
  .modal.wide{max-width:420px}
  .link{background:none;border:none;color:var(--faint);font-size:12px;cursor:pointer;font-family:inherit}
  .link:hover{color:#c0413a}

  .mask{position:fixed;inset:0;background:rgba(31,36,44,.32);display:none;align-items:center;justify-content:center;padding:24px;z-index:10}
  .mask.show{display:flex}
  .modal{background:var(--paper);border-radius:14px;padding:22px;width:100%;max-width:320px;box-shadow:0 20px 50px -20px rgba(0,0,0,.5)}
  .modal h3{font-family:'Noto Serif KR',serif;font-size:16px;font-weight:600;margin-bottom:12px}
  .modal input{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px 12px;font-size:15px;font-family:inherit;outline:none}
  .modal input:focus{border-color:var(--accent)}
  .modal .hint{font-size:12px;color:var(--faint);margin-top:8px;line-height:1.5}
  .modal-btns{display:flex;gap:8px;margin-top:18px}
  .btn{flex:1;border:none;border-radius:9px;padding:11px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit}
  .btn.ghost{background:var(--mist);color:var(--ink-soft)}
  .btn.solid{background:var(--ink);color:#f6f6f4}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="mask" id="mask">
  <div class="modal">
    <h3>인물 떠올리기</h3>
    <input id="name-input" placeholder="이름 또는 부르는 말" maxlength="24" autocomplete="off">
    <p class="hint">아직 흐릿해도 괜찮아요. 질문에 답하다 보면 한 조각씩 또렷해집니다.</p>
    <div class="modal-btns">
      <button class="btn ghost" id="modal-cancel">취소</button>
      <button class="btn solid" id="modal-ok">시작</button>
    </div>
  </div>
</div>

<div class="mask" id="io-mask">
  <div class="modal wide">
    <h3 id="io-title">내보내기</h3>
    <p class="hint" id="io-hint"></p>
    <textarea class="io-area" id="io-area" spellcheck="false"></textarea>
    <div class="modal-btns">
      <button class="btn ghost" id="io-close">닫기</button>
      <button class="btn solid" id="io-action">전체 선택</button>
    </div>
  </div>
</div>

  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const p=JSON.parse(raw); state.chars=p.chars||[]; state.activeId=p.activeId||null; }
  }catch(e){}
  if(state.activeId && !state.chars.find(c=>c.id===state.activeId)) state.activeId = state.chars[0]?.id||null;
}
let storageOK=null; // null=unknown, true=works, false=unavailable (e.g. private mode)
function flush(){
  try{
    localStorage.setItem(KEY, JSON.stringify(state));
    storageOK=true; setStatus("저장됨", false);
  }catch(e){
    storageOK=false; setStatus("자동 저장 안 됨 · 눌러서 백업", true);
  }
}
function persist(){ flush(); }
function setStatus(text, sticky){
  const el=document.getElementById("saved"); if(!el) return;
  el.textContent=text;
  el.style.color = sticky ? "#c0413a" : "";
  el.style.cursor = sticky ? "pointer" : "default";
  el.classList.add("show");
  clearTimeout(el._t);
  if(!sticky) el._t=setTimeout(()=>el.classList.remove("show"),1400);
}

function activeChar(){ return state.chars.find(c=>c.id===state.activeId)||null; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

function drawFor(c){
  const answered = new Set((c.entries||[]).map(e=>e.qid));
  let pool=[];
  for(let i=0;i<PROMPTS.length;i++){ if(i!==c.cur.qid && !answered.has(i)) pool.push(i); }
  if(pool.length===0){ for(let i=0;i<PROMPTS.length;i++){ if(i!==c.cur.qid) pool.push(i); } }
  return pool[Math.floor(Math.random()*pool.length)];
}
function commitDraft(c){
  const t=(c.cur.text||"").trim(), qid=c.cur.qid;
  c.entries = c.entries||[];
  const i = c.entries.findIndex(e=>e.qid===qid);
  if(t){
    if(i>=0){ c.entries[i].text=c.cur.text; c.entries[i].ts=Date.now(); }
    else c.entries.push({id:uid(), qid, q:PROMPTS[qid].q, c:PROMPTS[qid].c, text:c.cur.text, ts:Date.now()});
  }else if(i>=0){ c.entries.splice(i,1); }
}

function render(){
  const app=document.getElementById("app");
  const c=activeChar();
  app.innerHTML=`
    <div class="top">
      <div class="brand">인물 노트<span class="sub">하나씩 길어 올리기</span></div>
      <div class="saved" id="saved"></div>
    </div>
    <div class="people" id="people"></div>
    <div id="body"></div>
    <div class="footer-bar">
      <button class="link io" id="io-export">내보내기</button>
      <span class="dot">·</span>
      <button class="link io" id="io-import">복원</button>
    </div>`;
  const people=document.getElementById("people");
  state.chars.forEach(ch=>{
    const b=document.createElement("button");
    b.className="chip"+(ch.id===state.activeId?" active":"");
    b.textContent=ch.name;
    b.onclick=()=>{ state.activeId=ch.id; persist(); render(); };
    people.appendChild(b);
  });
  const add=document.createElement("button");
  add.className="chip add"; add.textContent="＋ 인물"; add.onclick=openAdd;
  people.appendChild(add);

  document.getElementById("io-export").onclick=openExport;
  document.getElementById("io-import").onclick=openImport;
  const sv=document.getElementById("saved");
  sv.onclick=()=>{ if(storageOK===false) openExport(); };
  if(storageOK===false) setStatus("자동 저장 안 됨 · 눌러서 백업", true);

  const body=document.getElementById("body");
  if(!c){ body.innerHTML=emptyHTML(); document.getElementById("empty-add").onclick=openAdd; return; }
  if(!c.cur) c.cur={qid:Math.floor(Math.random()*PROMPTS.length),text:""};
  body.innerHTML=cardHTML(c);
  wireCard(c);
}

function emptyHTML(){
  return `<div class="empty">
    <div class="e-title">아직 비어 있어요</div>
    <p>떠올리고 싶은 인물을 한 명 추가하면,<br>그 사람을 향한 질문이 하나씩 무작위로 열립니다.</p>
    <button class="btn solid" id="empty-add" style="max-width:200px;margin:0 auto;display:block">첫 인물 떠올리기</button>
  </div>`;
}

function cardHTML(c){
  const p=PROMPTS[c.cur.qid];
  const entries=[...(c.entries||[])].sort((a,b)=>b.ts-a.ts);
  let coll;
  if(entries.length===0){
    coll=`<div class="coll-empty">아직 모은 디테일이 없어요. 떠오른 한 가지부터.</div>`;
  }else{
    coll=entries.map(e=>`
      <div class="entry" data-qid="${e.qid}">
        <button class="e-del" data-id="${e.id}">✕</button>
        <div class="e-q">${CATS[e.c]} · ${escapeHtml(e.q)}</div>
        <div class="e-t">${escapeHtml(e.text)}</div>
      </div>`).join("");
  }
  return `
  <div class="card">
    <span class="eyebrow">${CATS[p.c]}</span>
    <div class="question">${escapeHtml(p.q)}</div>
    <textarea id="note" placeholder="떠오른 한 가지만, 가볍게. 안 떠오르면 다른 질문을 뽑아도 돼요.">${escapeHtml(c.cur.text||"")}</textarea>
    <div class="actions">
      <span class="keep">쓰는 즉시 이 인물에게 저장돼요</span>
      <button class="draw" id="draw">다른 질문<span class="arr">↻</span></button>
    </div>
  </div>
  <div class="coll">
    <div class="coll-head">
      <span class="coll-title">${escapeHtml(c.name)}의 디테일</span>
      <span class="coll-count">${entries.length}개</span>
    </div>
    ${coll}
    <div class="row-actions"><button class="link" id="remove">이 인물 지우기</button></div>
  </div>`;
}

function wireCard(c){
  const ta=document.getElementById("note");
  ta.addEventListener("input",()=>{
    c.cur.text=ta.value;
    clearTimeout(saveTimer);
    saveTimer=setTimeout(()=>{ commitDraft(c); persist(true); },600);
  });
  document.getElementById("draw").onclick=()=>{
    commitDraft(c);
    c.cur={qid:drawFor(c),text:""};
    persist(); render();
  };
  document.querySelectorAll(".entry").forEach(el=>{
    el.onclick=(ev)=>{
      if(ev.target.classList.contains("e-del")) return;
      commitDraft(c);
      const qid=+el.dataset.qid;
      const e=(c.entries||[]).find(x=>x.qid===qid);
      c.cur={qid, text:e?e.text:""};
      persist(); render();
      document.getElementById("note")?.focus();
    };
  });
  document.querySelectorAll(".e-del").forEach(btn=>{
    btn.onclick=(ev)=>{
      ev.stopPropagation();
      const id=btn.dataset.id;
      c.entries=(c.entries||[]).filter(x=>x.id!==id);
      persist(); render();
    };
  });
  document.getElementById("remove").onclick=()=>{
    if(confirm(`'${c.name}'에 대한 기록을 모두 지울까요? 되돌릴 수 없어요.`)){
      state.chars=state.chars.filter(x=>x.id!==c.id);
      state.activeId=state.chars[0]?.id||null;
      persist(); render();
    }
  };
}

function escapeHtml(s){return (s||"").replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));}

function openAdd(){
  const mask=document.getElementById("mask"), input=document.getElementById("name-input");
  mask.classList.add("show"); input.value=""; setTimeout(()=>input.focus(),50);
}
function closeAdd(){ document.getElementById("mask").classList.remove("show"); }
function doAdd(){
  const input=document.getElementById("name-input"), name=input.value.trim();
  if(!name) return;
  const ch={id:uid(),name,cur:{qid:Math.floor(Math.random()*PROMPTS.length),text:""},entries:[],createdAt:Date.now()};
  state.chars.push(ch); state.activeId=ch.id;
  closeAdd(); persist(); render();
}

/* ---------- export / import (manual backup) ---------- */
const MARK="###BACKUP###";
function buildExport(){
  // commit any in-progress draft so it's included
  const c=activeChar(); if(c&&c.cur) commitDraft(c);
  const out=["인물 노트 — 백업  ("+new Date().toLocaleString("ko-KR")+")",""];
  state.chars.forEach(ch=>{
    out.push("【 "+ch.name+" 】");
    const es=[...(ch.entries||[])].sort((a,b)=>a.ts-b.ts);
    if(!es.length) out.push("  (아직 디테일 없음)");
    es.forEach(e=>{ out.push("· "+e.q); out.push("  "+(e.text||"").replace(/\n/g,"\n  ")); out.push(""); });
    out.push("");
  });
  out.push("———————————————————————");
  out.push("아래 한 줄은 복원용 데이터예요. 지우지 말고 통째로 보관하세요.");
  out.push(MARK+" "+JSON.stringify(state));
  return out.join("\n");
}
function openExport(){
  const area=document.getElementById("io-area");
  document.getElementById("io-title").textContent="내보내기 · 백업";
  document.getElementById("io-hint").textContent="이 글을 전부 복사해서 메모앱 등에 보관하세요. 나중에 '복원'에 붙여넣으면 그대로 돌아옵니다.";
  area.value=buildExport(); area.readOnly=true;
  const act=document.getElementById("io-action"); act.textContent="전체 선택";
  act.onclick=()=>{ area.readOnly=false; area.focus(); area.select(); try{document.execCommand("copy");}catch(e){} area.readOnly=true; act.textContent="복사됨 ✓"; setTimeout(()=>act.textContent="전체 선택",1500); };
  document.getElementById("io-mask").classList.add("show");
}
function openImport(){
  const area=document.getElementById("io-area");
  document.getElementById("io-title").textContent="복원";
  document.getElementById("io-hint").textContent="이전에 내보낸 백업 글을 여기에 붙여넣고 '복원'을 누르세요. 현재 내용은 덮어쓰여요.";
  area.value=""; area.readOnly=false;
  const act=document.getElementById("io-action"); act.textContent="복원";
  act.onclick=doImport;
  document.getElementById("io-mask").classList.add("show");
  setTimeout(()=>area.focus(),50);
}
function doImport(){
  const raw=document.getElementById("io-area").value;
  let json=raw;
  const m=raw.indexOf(MARK);
  if(m>=0) json=raw.slice(m+MARK.length);
  json=json.trim();
  // strip anything before first { just in case
  const s=json.indexOf("{"); if(s>0) json=json.slice(s);
  try{
    const p=JSON.parse(json);
    if(!p || !Array.isArray(p.chars)) throw new Error("형식이 올바르지 않아요");
    state.chars=p.chars; state.activeId=p.activeId||p.chars[0]?.id||null;
    closeIO(); persist(); render();
  }catch(e){
    document.getElementById("io-hint").textContent="복원 실패: 백업 데이터를 찾지 못했어요. "+MARK+" 줄까지 포함해 통째로 붙여넣었는지 확인해 주세요.";
  }
}
function closeIO(){ document.getElementById("io-mask").classList.remove("show"); }

(async function(){
  await load(); render();
  document.getElementById("modal-cancel").onclick=closeAdd;
  document.getElementById("modal-ok").onclick=doAdd;
  document.getElementById("mask").addEventListener("click",e=>{ if(e.target.id==="mask") closeAdd(); });
  document.getElementById("name-input").addEventListener("keydown",e=>{ if(e.key==="Enter") doAdd(); });
  document.getElementById("io-close").onclick=closeIO;
  document.getElementById("io-mask").addEventListener("click",e=>{ if(e.target.id==="io-mask") closeIO(); });
})();
</script>
</body>
</html>
